name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: the docs app's typecheck resolves @underlying/core to dist.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      # Hard gate: every package's gzip budget (core's full surface plus its
      # primitives-only and animate-only tree-shake probes, and each add-on and
      # adapter) fails the build if exceeded. Budgets live in each package's
      # scripts/check-size.mjs - the single source of truth for the numbers.
      - name: Size budget
        run: pnpm size
